# K15 生产测试上位机默认配置（Ubuntu 22.04）
# 本机仅展示日志；所有命令通过 SSH + docker exec 在域控执行。

domain_controller:
  host: "192.168.1.100"
  port: 22
  user: "anyverse"
  # 留空则使用本机默认 SSH 私钥（~/.ssh/id_rsa / id_ed25519）
  password: ""
  key_filename: ""
  # 宿主机上 anyverse 仓库路径
  host_work_dir: "/home/anyverse/work/anyverse"
  # Docker 容器名（docker ps 可见）；留空则自动匹配含 anyverse 的容器
  container_name: ""
  # 容器内工作目录
  container_work_dir: "/anyverse"

pc:
  # 上位机本机 IP，用于写入域控 cyclonedds.xml 的 Peer
  ip: "192.168.1.10"
  # 本机 cyclonedds 路径（仅提示/可选本地写文件，不跑 ROS）
  cyclonedds_path: ""

ros:
  domain_id: 40
  localhost_only: 0
  rmw: "rmw_cyclonedds_cpp"
  cyclonedds_uri: "/anyverse/config/cyclonedds.xml"
  # 域控 DDS 网卡名（文档示例 eth5）
  network_interface: "eth5"

git:
  branch: "dev/pnc"
  repo: "git@gitlab.anyverse.work:dev/anyverse.git"
  host_clone_parent: "/home/anyverse/work"

docker:
  daemon_json_path: "/etc/docker/daemon.json"
  registry_mirrors:
    - "https://docker.xuanyuan.me"
    - "https://docker.1ms.run"
    - "https://hub.rat.dev"
    - "https://registry.docker-cn.com"
  insecure_registries:
    - "docker.anyverse.work"
    - "registry.docker-cn.com"

moveit:
  moveit_config_package: "kitt_1_5_robot_with_zx90d_moveit"
  controller_package: "hardware_integration"
  controller_launch: "controller.launch.py"
  latency_script: "controller_state_latency6.py"
  hw_params_relpath: "src/pnc/config/moveit_config/kitt_1_5_robot_with_zx90d_moveit/config/kitt_1_5_robot_with_zx90d_hw_params.yaml"

report:
  output_dir: "reports"
